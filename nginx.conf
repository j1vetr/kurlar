# Kurlar — SSR kurulumu
# Sayfa istekleri Node/Express SSR sunucusuna proxy'lenir (gerçek HTTP 404,
# 301 normalizasyonu ve SEO head etiketleri oradan gelir). Statik dosyalar
# performans için doğrudan diskten servis edilir.
#
# Node sunucusu: NODE_ENV=production PORT=3000 node dist/index.cjs

server {
    listen 80;
    server_name kurlar.com.tr www.kurlar.com.tr;

    root /var/www/kurlar/dist/public;

    # Gzip Compression - Hız için sıkıştırma ayarları
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json;
    gzip_disable "MSIE [1-6]\.";

    # Statik dosyalar doğrudan diskten, uzun süreli cache ile
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp|woff|woff2|ttf|eot|pdf|xml|txt|webmanifest)$ {
        expires 365d;
        add_header Cache-Control "public, no-transform, max-age=31536000";
        access_log off;
        try_files $uri @ssr;
    }

    # Tüm sayfa istekleri SSR sunucusuna
    location / {
        try_files /nonexistent @ssr;
    }

    location @ssr {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Güvenlik Başlıkları
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
}
