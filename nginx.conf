server {
    listen 80;
    server_name kurlar.com.tr www.kurlar.com.tr;

    root /var/www/kurlar/dist/public;
    index index.html;

    # Gzip Compression - Hız için sıkıştırma ayarları
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json;
    gzip_disable "MSIE [1-6]\.";

    location / {
        # SPA (Single Page Application) yönlendirmesi
        # React router (wouter) için tüm istekleri index.html'e yönlendirir
        try_files $uri $uri/ /index.html;
    }

    # Statik dosyalar için Cache (Önbellek) ayarları
    # Resimler, CSS, JS dosyaları tarayıcıda uzun süre tutulur (Hız için kritik)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|webp|woff|woff2|ttf|eot)$ {
        expires 365d;
        add_header Cache-Control "public, no-transform, max-age=31536000";
        access_log off;
    }

    # Güvenlik Başlıkları
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    # Hata sayfaları
    error_page 404 /index.html;
}
